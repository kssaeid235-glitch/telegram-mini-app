<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>Viral Video · Premium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="bg-grid"></div>
  </div>

  <header class="app-header" id="appHeader">
    <div class="brand ripple">
      <div class="brand-logo">V</div>
      <div class="brand-text">
        <span class="brand-name">Viral Video</span>
        <span class="brand-tag">PREMIUM</span>
      </div>
    </div>
    <div class="header-user ripple" id="headerUser">
      <img class="header-avatar" id="headerAvatar" alt="">
      <div class="header-user-meta">
        <span class="header-name" id="headerName">Guest</span>
        <span class="header-id" id="headerId">#0</span>
      </div>
    </div>
  </header>

  <main class="main-content" id="mainContent">
    <section class="tab-page active" id="page-home" data-tab="home"></section>
    <section class="tab-page" id="page-reward" data-tab="reward"></section>
    <section class="tab-page" id="page-channel" data-tab="channel"></section>
    <section class="tab-page" id="page-settings" data-tab="settings"></section>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active ripple" data-nav="home" type="button">
      <span class="nav-ico">🏠</span><span class="nav-label" id="navLabelHome">হোম</span>
    </button>
    <button class="nav-btn ripple" data-nav="reward" type="button">
      <span class="nav-ico">🎁</span><span class="nav-label" id="navLabelReward">রিওয়ার্ড</span>
    </button>
    <button class="nav-btn ripple" data-nav="channel" type="button">
      <span class="nav-ico">📢</span><span class="nav-label" id="navLabelChannel">চ্যানেল</span>
    </button>
    <button class="nav-btn ripple" data-nav="settings" type="button">
      <span class="nav-ico">⚙️</span><span class="nav-label" id="navLabelSettings">সেটিংস</span>
    </button>
  </nav>

  <div class="overlay-root" id="overlayRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script src="./app.js"></script>
</body>
</html>
